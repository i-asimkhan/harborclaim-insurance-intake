# After a merge to main passes the Tests workflow: publish the next GitHub release, then deploy
# that build to the live Azure site.
#
# Release: tags the tested commit with the next minor version (v1.0.0 first, then v1.1.0, ...) and
# publishes a release whose notes GitHub builds from the merged PRs. A commit that already has a
# release tag is skipped, so a re-run never makes a second release.
#
# Deploy: the same Sync as the portal's Deployment Center (the site deploys from main), a wait
# until Azure reports this commit built and active, then a smoke test of a page only the new build
# serves. It needs one repository secret, AZURE_CREDENTIALS: a service
# principal scoped to the harborclaim-rg resource group (README, "Deploying to Azure App Service").
# Without the secret the job says so and stops, and the release still happens. No app setting,
# key or secret value is ever printed or changed here.
name: Release and deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_NAME: harborclaim-demo-2630
  RESOURCE_GROUP: harborclaim-rg
  SITE_URL: https://harborclaim-demo-2630.azurewebsites.net

jobs:
  release:
    # Only a push to main whose tests passed; never a pull request's run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          existing=$(git tag --points-at "$sha" --list 'v*' | head -n 1)
          if [ -n "$existing" ]; then
            echo "Commit already released as $existing; nothing to do."
            echo "version=$existing" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor _patch <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          echo "Next release: $next (previous: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "HarborClaim ${{ steps.version.outputs.version }}" \
            --generate-notes

  deploy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check the Azure secret is set
        id: secret
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::warning::AZURE_CREDENTIALS is not set, so ${{ needs.release.outputs.version }} was released but not deployed. Sync in the portal, or add the secret."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to Azure
        if: steps.secret.outputs.present == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check the app settings
        if: steps.secret.outputs.present == 'true'
        # Before deploying: the settings the app needs exist, and the AI isn't switched off. Reads
        # setting names, plus the values of AI_ENABLED and AI_DATA_POLICY only (not secrets); a
        # secret's value is never read or printed.
        run: |
          names=$(az webapp config appsettings list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv)
          missing=""
          for n in SESSION_SECRET_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET HARBORCLAIM_DATA_DIR \
                   AI_PROVIDER AI_MODELS OPENROUTER_API_KEY; do
            echo "$names" | grep -qx "$n" || missing="$missing $n"
          done
          value() {
            az webapp config appsettings list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --query "[?name=='$1'].value | [0]" -o tsv
          }
          enabled=$(value AI_ENABLED | tr '[:upper:]' '[:lower:]')
          policy=$(value AI_DATA_POLICY | tr '[:upper:]' '[:lower:]')
          echo "AI_ENABLED='${enabled:-unset}' AI_DATA_POLICY='${policy:-unset (test)}'"
          if [ -n "$missing" ]; then echo "::error::Missing app settings:$missing"; exit 1; fi
          case "$enabled" in false|0|no|off) echo "::error::AI_ENABLED switches the AI off."; exit 1;; esac
          if [ "$policy" = "production" ]; then
            echo "::error::AI_DATA_POLICY=production refuses the free models in AI_MODELS, so every AI feature would fall back."
            exit 1
          fi
          echo "All required settings are present and the AI is on."

      - name: Sync the site from main
        if: steps.secret.outputs.present == 'true'
        run: az webapp deployment source sync --name "$APP_NAME" --resource-group "$RESOURCE_GROUP"

      - name: Wait for Azure to build this commit
        if: steps.secret.outputs.present == 'true'
        # The old build keeps answering while the new one builds (first deploy, 2026-11-10: the site
        # answered 200 before the new code was live), so wait on Azure's own record for this commit.
        # Status 4 is success, 3 is failed. The Free plan's build takes a few minutes; allow 20.
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 40); do
            # An az failure (sign-in, resource group, CLI) fails the step at once instead of
            # reading as "not started" for 20 minutes.
            if ! status=$(az webapp log deployment list --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                  --query "[?id=='$SHA'] | [0].status" -o tsv); then
              echo "::error::Could not read Azure's deployment list (see the az error above)."
              exit 1
            fi
            echo "Check $i: deployment status '${status:-not started}'"
            if [ "$status" = "4" ]; then echo "Azure built and activated $SHA."; exit 0; fi
            if [ "$status" = "3" ]; then echo "::error::Azure's build of $SHA failed (see Deployment Center logs)."; exit 1; fi
            sleep 30
          done
          echo "::error::Azure did not finish building $SHA within 20 minutes. If another commit reached main"
          echo "::error::in the meantime, the Sync built that one instead; check Deployment Center."
          exit 1

      - name: Smoke test
        if: steps.secret.outputs.present == 'true'
        # Pages only the new build has, not just "the site answers": /adjuster/ai redirects to the
        # adjuster login (303) once it exists, and was a 404 on the old build.
        run: |
          for i in $(seq 1 10); do
            login=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/adjuster/login" || true)
            ai=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/adjuster/ai" || true)
            echo "Attempt $i: /adjuster/login $login, /adjuster/ai $ai"
            if [ "$login" = "200" ] && [ "$ai" = "303" ]; then echo "The new build is live."; exit 0; fi
            sleep 30
          done
          echo "::error::The site did not serve the new build within 5 minutes of Azure finishing."
          exit 1
