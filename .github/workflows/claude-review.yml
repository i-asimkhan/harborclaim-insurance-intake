# Automatic Claude code review on every pull request (anthropics/claude-code-action).
#
# Authentication uses the owner's Claude subscription, not a paid API key: the repository secret
# CLAUDE_CODE_OAUTH_TOKEN holds a token created locally with `claude setup-token`. The Claude
# GitHub App (https://github.com/apps/claude) must be installed on this repository.
# Setup reference: https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md
#
# Review only: the allowed tools let Claude read the PR and post comments, nothing else.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for HarborClaim, a FastAPI insurance-claim intake app (a
            university course project; all data is fictional). Focus on:
            - Correctness bugs and missing tests.
            - Security: secrets or keys in the diff, injection, access-control gaps (a claimant
              must only ever see their own claims; claimant and adjuster routes stay separate).
            - The project's hard rules:
              * main.py and test_main.py (the graded minimum) must not change.
              * No AI code may approve, decline, pay, change a claim's status or notify anyone;
                agent tools are read-only (see docs/design/AGENTS.md, section 8).
              * AI stays off by default, and tests must never call a real model or send email.
              * Labels stay honest: anything not produced by AI must not be labelled as AI.
            - Docs (ROADMAP.md, AGENTS.md, README.md) kept consistent with the code.
            Be concise; skip praise and style nits.
            Note: The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
