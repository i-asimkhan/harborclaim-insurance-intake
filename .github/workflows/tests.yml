# Runs the full test suite on every pull request and on every push to main.
#
# No secrets are needed or used: tests/conftest.py pins email to "simulated" and AI off, and uses a
# throwaway data folder, so the suite never sends email, never calls a model, and never touches a
# real database. The browser tests' extra packages are installed here, pinned, rather than in
# requirements.txt, which Azure installs on deploy.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright==1.63.0 pytest-playwright==0.10.0
          python -m playwright install --with-deps chromium

      - name: Graded minimum (standard library only)
        run: python -m unittest -v test_main

      - name: Full suite (app, agents, browser)
        run: python -m pytest -q
